name: npm-publish

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      package-version:
        description: Package version (e.g. v1.14.0)
        required: true
        type: string
jobs:
  npm:
    name: 'update npm package'
    runs-on: ubuntu-latest
    # Docker also runs on every push to main; only its release run means the GitHub release is published.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: read
    env:
      PACKAGE_NAME: 'couper'
      PACKAGE_VERSION: ${{ github.event.inputs.package-version || github.event.workflow_run.head_branch }}
      # https://github.com/JS-DevTools/npm-publish/issues/15
      INPUT_TOKEN: ''
    steps:
      - name: 'checkout'
        uses: actions/checkout@v6
      - name: 'require a published release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$PACKAGE_VERSION' is not a release tag"; exit 1; }
          draft=$(gh release view "$PACKAGE_VERSION" --json isDraft --jq .isDraft) || { echo "::error::release $PACKAGE_VERSION not found"; exit 1; }
          [[ "$draft" == "false" ]] || { echo "::error::release $PACKAGE_VERSION is still a draft"; exit 1; }
      - name: 'prepare package'
        run: |
          cp LICENSE .npm
          curl -L https://github.com/malud/temgo/releases/download/0.2.1/tg -o tg
          chmod +x tg
          PACKAGE_VERSION=${PACKAGE_VERSION#v}
          ./tg -i .npm/package.json
          cat .npm/package.json
      - name: 'setup node'
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: 'publish package'
        uses: JS-DevTools/npm-publish@v4
        with:
          package: ".npm/package.json"
          access: "public"
          token: ${{ secrets.NPM_TOKEN }}
      - name: 'test published package'
        run: |
          cd $(mktemp -d) && npm install ${PACKAGE_NAME}@${PACKAGE_VERSION#v} && npx couper version
